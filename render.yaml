services:
  - type: web
    name: gl-garantias-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PRODUCTION_URL
        sync: false

  - type: static
    name: gl-garantias-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html